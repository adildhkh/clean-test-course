name: Lesson 5 DAST + Video

on:
  push:
    branches:
      - lesson-5

jobs:
  security_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.7.0
        with:
          target: 'https://example.com' # Replace with your actual target
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ZAP Reports
        uses: actions/upload-artifact@v4
        with:
          name: zap-reports
          path: |
            report_json.json
            report_md.md
            report_html.html

  video_generation:
    runs-on: ubuntu-latest
    needs: security_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Video from Reports
        run: |
          ffmpeg -loop 1 -i report_html.html \
            -c:v libx264 -t 10 -pix_fmt yuv420p report_video.mp4

      - name: Upload Video
        uses: actions/upload-artifact@v4
        with:
          name: zap-video
          path: report_video.mp4


