name: Lesson 6
on:
  push:
    branches:
      - lesson-6
      - lesson-6-complete

jobs:
  function_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies
        run: npm install
      - name: Run functional tests
        run: npm test -- --coverage --watchAll=false

  deploy:
    needs: function_test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install dependencies and build
        run: |
          npm install
          npm run build
      - name: Generate deployment package
        run: zip -r deploy.zip build Dockerfile
      - name: Deploy to Elastic Beanstalk (Placeholder)
        run: echo "Placeholder for Deployment"

  # Start local server for both security and acceptance testing
  start_test_server:
    needs: deploy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build the application
        run: npm run build
      - name: Install serve globally
        run: npm install -g serve
      - name: Start the application
        run: |
          echo "Starting the application on localhost:3000..."
          serve -s build -l 3000 &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV
          echo "Server started with PID: $SERVER_PID"
          sleep 5
      - name: Wait for application to be ready
        run: |
          echo "Waiting for application to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:3000; do 
            echo "Waiting for server to start..."
            sleep 2
          done'
          echo "✅ Application is ready at http://localhost:3000"
          curl -I http://localhost:3000
      - name: Keep server running for other jobs
        run: |
          echo "Server is running. Other jobs can now access http://localhost:3000"
          # Keep the job alive for a reasonable time
          sleep 300 &
          wait

  security_test:
    needs: start_test_server
    runs-on: ubuntu-latest
    steps:
      - name: Check localhost server
        run: |
          echo "Checking if localhost server is accessible..."
          if curl -f --connect-timeout 10 --max-time 30 http://localhost:3000/; then
            echo "✅ Localhost server is accessible"
            echo "TARGET_URL=http://localhost:3000" >> $GITHUB_ENV
          else
            echo "❌ Localhost server not accessible, checking Elastic Beanstalk..."
            if curl -f --connect-timeout 10 --max-time 30 http://hangry-web-dev.us-east-1.elasticbeanstalk.com/; then
              echo "✅ Elastic Beanstalk is accessible"
              echo "TARGET_URL=http://hangry-web-dev.us-east-1.elasticbeanstalk.com" >> $GITHUB_ENV
            else
              echo "❌ Neither localhost nor Elastic Beanstalk accessible"
              echo "TARGET_URL=" >> $GITHUB_ENV
            fi
          fi
      - name: Dynamic Application Security Scan
        if: env.TARGET_URL != ''
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.TARGET_URL }}
        continue-on-error: true
      - name: Security scan status
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "⚠️ Security scan was skipped - no accessible target found"
            echo "Checked URLs:"
            echo "- http://localhost:3000 (not accessible)"
            echo "- http://hangry-web-dev.us-east-1.elasticbeanstalk.com (not accessible)"
          else
            echo "✅ Security scan completed against: $TARGET_URL"
          fi

  acceptance_test:
    needs: start_test_server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Determine test target
        run: |
          echo "Determining which URL to test against..."
          
          # First try localhost (from the start_test_server job)
          if curl -f --connect-timeout 5 --max-time 10 http://localhost:3000/ 2>/dev/null; then
            echo "✅ Using localhost:3000"
            echo "CYPRESS_BASE_URL=http://localhost:3000" >> $GITHUB_ENV
            echo "TEST_TARGET=localhost" >> $GITHUB_ENV
          
          # Then try Elastic Beanstalk
          elif curl -f --connect-timeout 5 --max-time 10 http://hangry-web-dev.us-east-1.elasticbeanstalk.com/ 2>/dev/null; then
            echo "✅ Using Elastic Beanstalk URL"
            echo "CYPRESS_BASE_URL=http://hangry-web-dev.us-east-1.elasticbeanstalk.com" >> $GITHUB_ENV
            echo "TEST_TARGET=beanstalk" >> $GITHUB_ENV
          
          # Fallback: start our own local server
          else
            echo "⚠️ Neither target accessible, starting local server..."
            npm run build
            npm install -g serve
            serve -s build -l 3000 &
            LOCAL_SERVER_PID=$!
            echo "LOCAL_SERVER_PID=$LOCAL_SERVER_PID" >> $GITHUB_ENV
            echo "TEST_TARGET=local_fallback" >> $GITHUB_ENV
            
            # Wait for local server
            sleep 5
            timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'
            echo "CYPRESS_BASE_URL=http://localhost:3000" >> $GITHUB_ENV
            echo "✅ Local fallback server ready"
          fi
          
          echo "Selected target: $TEST_TARGET"
          echo "Cypress will test: $CYPRESS_BASE_URL"
      - name: Install Cypress
        run: npx cypress install
      - name: Run Cypress tests
        run: |
          echo "🧪 Running Cypress tests against: $CYPRESS_BASE_URL"
          npx cypress run --config video=true --config-file=cypress.config.js
        env:
          CYPRESS_BASE_URL: ${{ env.CYPRESS_BASE_URL }}
      - name: Upload Cypress videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-videos-${{ env.TEST_TARGET }}
          path: frontend/cypress/videos
      - name: Upload Cypress screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots-${{ env.TEST_TARGET }}
          path: frontend/cypress/screenshots
      - name: Test results summary
        if: always()
        run: |
          echo "📊 Test Summary:"
          echo "Target used: $TEST_TARGET"
          echo "Base URL: $CYPRESS_BASE_URL"
          if [ "$TEST_TARGET" = "local_fallback" ]; then
            echo "Note: Tests ran against local server due to external targets being unavailable"
          fi
      - name: Clean up local server
        if: always() && env.LOCAL_SERVER_PID != ''
        run: |
          echo "🧹 Cleaning up local server (PID: $LOCAL_SERVER_PID)"
          kill $LOCAL_SERVER_PID || true
